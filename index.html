/* ==========================================================================

/* ==========================================================================

.fab { position: fixed; right: 20px; bottom: 20px; z-index: 56; display: none; }

/* Hero headline: line-by-line reveal (intro only). Line boxes are measured with a Range — no DOM

function revealHeadline() {
  const h1 = $("#hero-title"); if (!h1 || !M.full || !h1.firstChild) return;
  const range = document.createRange(); range.selectNodeContents(h1);
  const box = h1.getBoundingClientRect(), bottoms = [];
  for (const r of range.getClientRects()) { const b = Math.round(r.bottom - box.top); if (!bottoms.some((x) => Math.abs(x - b) < 6)) bottoms.push(b); }

  bottoms.forEach((b, i) => frames.push({ clipPath: `inset(0 0 ${Math.max(0, H - 8 - b)}px 0)`, transform: `translateY(${(10 * (n - 1 - i)) / n}px)`, offset: (i + 1) / n }));
  frames[frames.length - 1] = { clipPath: "inset(0 0 -10px 0)", transform: "none", offset: 1 };

  if (channel !== "print" && !validateFields(form, [["name", (v) => v.length > 1, "err.required"], ["phone", validPhone, "err.phone"]])) return;
  if (!q.ref) q.ref = newRef();
  const msg = buildQuoteMessage({ lines: q.lines, client: clientFromForm(), lang: state.lang, ref: q.ref, date: new Date() });
  track("quote_send", { channel, lines: q.lines.length, ref: q.ref });
  if (channel === "print") return printQuote();
  if (channel === "mail") { location.href = mailLink(t("quote.mailSubject", { ref: q.ref }), plain(msg)); return; }
  const layer = $("#q-stamp", quoteEl);
  await stamp(layer);
  openWa(msg);
  setTimeout(() => { layer.classList.remove("is-on"); layer.setAttribute("aria-hidden", "true"); }, 1600);
}

/* ==========================================================================
   13. WHATSAPP MESSAGE BUILDERS — pure functions (tested against fixtures)
   ========================================================================== */
function buildQuoteMessage({ lines, client = {}, lang = state.lang, ref, date = new Date() }) {
  const L = (k, v) => t(k, v, lang);
  const out = [L("wa.quoteTitle"), L("wa.ref", { v: ref }), L("wa.date", { v: fmtDate(date) }), "", L("wa.items")];
  lines.forEach((l, i) => {
    out.push(`${i + 1}. ${L("quote.kinds." + l.kind)} — ${lineLabel(l, lang)} ${L("wa.qtyX", { n: l.qty })}`);
    if (l.note && l.note.trim()) out.push(`   ${L("wa.note", { v: l.note.trim() })}`);
  });
  const c = client, cl = [];
  if (c.name) cl.push(L("wa.name", { v: c.name.trim() }));
  if (c.phone) cl.push(L("wa.phone", { v: c.phone.trim() }));
  if (c.city) cl.push(L("wa.city", { v: c.city.trim() }));
  if (c.type) cl.push(L("wa.type", { v: L("usage." + c.type) }));
  if (c.date) cl.push(L("wa.wanted", { v: isoToFr(c.date) }));
  if (c.message && c.message.trim()) cl.push(L("wa.message", { v: c.message.trim() }));
  if (cl.length) out.push("", L("wa.clientH"), ...cl);
  out.push("", L("wa.footer"));
  return out.join("\n");
}
function buildInspectionMessage(d, lang = state.lang) {
  const L = (k, v) => t(k, v, lang);
  const out = [L("wa.inspTitle"), "", L("wa.place", { v: L("usage." + d.place) })];
  if (d.size !== "" && d.size != null) out.push(L("wa.size", { v: L("insp.sizes." + d.size) }));
  out.push(L("wa.services", { v: d.services.map((s) => L(`svc.${s}.title`)).join(", ") }), "");
  out.push(L("wa.name", { v: d.name.trim() }), L("wa.phone", { v: d.phone.trim() }));
  if (d.city) out.push(L("wa.city", { v: d.city.trim() }));
  if (d.day) out.push(L("wa.day", { v: isoToFr(d.day) }));
  if (d.slot !== "" && d.slot != null) out.push(L("wa.slot", { v: L("insp.slots." + d.slot) }));
  if (d.message && d.message.trim()) out.push(L("wa.message", { v: d.message.trim() }));
  out.push("", L("wa.footer"));
  return out.join("\n");
}
function buildContactMessage(d, lang = state.lang) {
  const L = (k, v) => t(k, v, lang);
  const out = [L("wa.hello"), "", d.message.trim(), ""];
  if (d.name) out.push(L("wa.name", { v: d.name.trim() }));
  if (d.phone) out.push(L("wa.phone", { v: d.phone.trim() }));
  return out.join("\n").trim();
}

function goStep(n, { focus = true } = {}) {
  insp.step = Math.max(1, Math.min(3, n));
  $$("#insp-form .step").forEach((s) => { s.hidden = +s.dataset.step !== insp.step; });
  $$("[data-step-h]").forEach((h) => { const k = +h.dataset.stepH; h.toggleAttribute("aria-current", k === insp.step); if (k === insp.step) h.setAttribute("aria-current", "step"); h.classList.toggle("done", k < insp.step); });
  $("#insp-prog").style.transform = `scaleX(${insp.step / 3})`;
  $(".steps-prog").setAttribute("aria-valuenow", insp.step);
  $("#insp-back").hidden = insp.step === 1; $("#insp-next").hidden = insp.step === 3; $("#insp-submit").hidden = insp.step !== 3;
  const step = $(`#insp-form .step[data-step="${insp.step}"]`);
  if (M.on && focus) step.animate([{ opacity: 0, transform: "translateX(10px)" }, { opacity: 1, transform: "none" }], { duration: M.full ? 300 : 100, easing: "cubic-bezier(.16,1,.3,1)" });
  if (focus) $("input, select", step)?.focus({ preventScroll: true });
}
function validateStep(n) {
  if (n === 1) {
    const ok = !!insp.place;
    $('[data-field="place"]').classList.toggle("is-invalid", !ok);
    ok ? ($("#err-place").textContent = "") : setT($("#err-place"), "err.place");
    if (!ok) $('input[name="place"]').focus();
    return ok;
  }
  if (n === 2) {
    const ok = insp.services.length > 0;
    ok ? ($("#err-services").textContent = "") : setT($("#err-services"), "err.services");
    if (!ok) $('input[name="services"]').focus();
    return ok;
  }
  return validateFields($("#insp-form"), [["name", (v) => v.length > 1, "err.required"], ["phone", validPhone, "err.phone"], ["city", (v) => v.length > 1, "err.required"], ["day", (v) => !v || v >= todayIso(), "err.date"]]);
}
async function submitInspection() {
  if (!validateStep(3)) return;
  const msg = buildInspectionMessage(insp);
  track("inspection_send", { place: insp.place, services: insp.services.length });
  await stamp($("#insp-stamp"));
  openWa(msg);
  $("#insp-wa").href = waLink(msg);
  $("#insp-mail").href = mailLink(t("insp.mailSubject"), plain(msg));
  $("#insp-form").hidden = true; $(".steps-head").hidden = true;
  const s = $("#insp-stamp"); s.classList.remove("is-on"); s.setAttribute("aria-hidden", "true");
  $("#insp-success").hidden = false; $("#insp-success").focus();
}
function prefillInspection(slug) {
  if (!slug) return;
  const box = $(`#insp-form input[name="services"][value="${slug}"]`);
  if (box && !box.checked) { box.checked = true; box.closest(".checkrow").classList.add("is-checked"); insp.services = [...new Set([...insp.services, slug])]; }
  if (state.sheet) closeService();
  setTimeout(() => scrollToId("inspection"), 80);
}

   11. SEARCH — accent-insensitive, typo-tolerant, keyboard navigable
   ========================================================================== */
function editDistance(a, b, max = 2) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    let rowMin = Infinity;
    for (let j = 1; j <= b.length; j++) {
      const c = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      rowMin = Math.min(rowMin, d[i][j]);
    }
    if (rowMin > max) return max + 1;
  }
  return d[a.length][b.length];
}
/** Score of the best match of query word `q` among `words`: exact 3, prefix 2.5, typo 1.4, substring 1. */
function bestWord(q, words) {
  let best = 0;
  const tol = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0;
  for (const w of words) {
    if (!w) continue;
    if (w === q) return 3;
    if (w.startsWith(q)) { best = Math.max(best, 2.5); continue; }
    if (tol && (editDistance(q, w, tol) <= tol || editDistance(q, w.slice(0, q.length), tol) <= tol || editDistance(q, w.slice(0, q.length + 1), tol) <= tol)) best = Math.max(best, 1.4);
    else if (q.length >= 3 && w.includes(q)) best = Math.max(best, 1);
  }
  return best;
}
let INDEX = [];
function buildSearchIndex() {
  const words = (s) => norm(s).split(" ").filter(Boolean);
  INDEX = [
    ...SERVICES.map((s) => ({ type: "service", id: s.slug, title: s.title, sub: s.tagline, icon: s.eq, tw: words(s.title + " " + s.short), w: words([s.tagline, ...s.features, ...s.solutions, t("groups." + s.group)].join(" ")) })),
    ...EQUIPMENT.map((e) => ({ type: "equipment", id: e.ref, title: e.name, sub: SVC[e.service].short, icon: e.icon, tw: words(e.name + " " + e.ref), w: words([e.short, ...e.highlights, ...e.tags, ...e.brands, SVC[e.service].title, t("cat." + e.category)].join(" ")) })),
    ...t("faq.items").map((f, i) => ({ type: "faq", id: i, title: f.q, sub: f.a, icon: null, tw: words(f.q), w: words(f.a) }))
  ];
}
function search(query) {
  if (!INDEX.length) buildSearchIndex();
  const q = norm(query).split(" ").filter(Boolean);
  if (!q.length) return [];
  const res = [];
  for (const it of INDEX) {
    let score = 0, ok = true;
    for (const w of q) {
      const a = bestWord(w, it.tw) * 2, b = bestWord(w, it.w);
      const m = Math.max(a, b); if (!m) { ok = false; break; } score += m;
    }
    if (ok) res.push({ ...it, score: score + (it.type === "service" ? 1 : 0) });
  }
  res.sort((a, b) => b.score - a.score);
  return [...res.filter((r) => r.type === "service").slice(0, 5), ...res.filter((r) => r.type === "equipment").slice(0, 8), ...res.filter((r) => r.type === "faq").slice(0, 4)];
}
function highlight(text, query) {
  const q = norm(query).split(" ").filter((w) => w.length > 1);
  const base = text.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  if (base.length !== text.length) return esc(text);
  const marks = [];
  for (const w of q) { const i = base.indexOf(w); if (i >= 0) marks.push([i, i + w.length]); }
  if (!marks.length) return esc(text);
  marks.sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  for (const [s, e] of marks) { if (s < pos) continue; out += esc(text.slice(pos, s)) + "<mark>" + esc(text.slice(s, e)) + "</mark>"; pos = e; }
  return out + esc(text.slice(pos));
}
let searchEl = null;

document.addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("input, textarea, select, [contenteditable]");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (!searchEl) openSearch(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (layers.length && e.key !== "?") return;

  else if (e.key === "d" || e.key === "D") { e.preventDefault(); openQuote(); }

   15. INIT
   ========================================================================== */
const nextTask = () => new Promise((r) => (window.scheduler?.yield ? window.scheduler.yield().then(r) : setTimeout(r, 0)));
async function init() {
  state.quote = loadQuote();
  applyTheme();
  // 1) Above the fold first, so it paints quickly
  renderHeader(); renderBottomBar(); renderFab(); renderHero();
  for (const el of [$(".skip"), $("#site-header"), $("#bottom-bar")]) applyI18n(el); // static shell attributes
  updateHead(); syncSettingsUI(); initHeaderScroll();
  window.RG = RG;
  runIntro();
  const dcl = document.readyState === "loading" ? new Promise((r) => document.addEventListener("DOMContentLoaded", r, { once: true })) : Promise.resolve();
  // 2) The rest of the page, one section per task (no long main-thread blocks). A deep link renders everything at once.
  const rest = [renderServices, renderProcess, renderClients, renderCatalog, renderCatalogueSection, renderInspection, renderWhy, renderRealisations, renderAvis, renderFaq, renderContact, renderFooter];
  const deep = !!location.hash.slice(1);
  for (const fn of rest) { fn(); if (!deep) await nextTask(); }
  syncCounts(); syncSettingsUI();
  route({ initial: true });
  document.documentElement.dataset.ready = "1";
  // 3) Motion libraries: on first interaction / idle (immediately for deep links)
  await dcl;
  startMotion({ now: deep });
  matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", () => { if (!state.motion) setMotion(null); });
  addEventListener("storage", (e) => { if (e.key === QUOTE_KEY) { state.quote = loadQuote(); emit("quote"); } });
}
